# Eduino_PostPilot - Streamlit 테마/서버 설정
# 밝은 테마 + 틸(아두이노 감성) 포인트 컬러로 고정

[theme]
base = "light"
primaryColor = "#0e7490"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7fa"
textColor = "#1e293b"
font = "sans serif"

[server]
headless = true          # run.bat이 브라우저를 열므로 자동 오픈 중복 방지
runOnSave = false

[browser]
gatherUsageStats = false
