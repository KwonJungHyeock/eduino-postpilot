# Eduino_PostPilot - Streamlit 테마/서버 설정
# 다크 테마 + 에듀이노 브랜드 레드 포인트 컬러 (AI LAB 레퍼런스 톤)

[theme]
base = "dark"
primaryColor = "#f0584d"
backgroundColor = "#0a0e16"
secondaryBackgroundColor = "#141b27"
textColor = "#e6edf3"
font = "sans serif"

[server]
runOnSave = false
# headless 미지정(기본 false) → 서버 준비 후 Streamlit이 브라우저를 자동으로 엽니다

[browser]
gatherUsageStats = false
